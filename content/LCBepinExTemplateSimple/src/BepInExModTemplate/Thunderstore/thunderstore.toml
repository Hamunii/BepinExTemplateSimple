[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
namespace = "YourThunderstoreNamespace"
name = "YourModName"
description = "Description for this mod."
websiteUrl = "link to your github here"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2100"

[build]
icon = "../../../icon.png"
readme = "../../../README.md"
outdir = "../../../artifacts/thunderstore/"

[[build.copy]]
source = "../../../artifacts/bin/YourProject/release/YourProject.dll"
target = "plugins/"

[[build.copy]]
source = "../../../CHANGELOG.md"
target = "/"

[[build.copy]]
source = "../../../LICENSE"
target = "/"

[publish]
communities = [ "repo", ]
[publish.categories]
repo = [ "mods", "tools", "libraries", ]
